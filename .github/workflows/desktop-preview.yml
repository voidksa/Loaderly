name: Desktop preview checks
on:
  workflow_dispatch:
  push:
    branches: [codex/macos-linux-preview]
permissions:
  contents: read
jobs:
  native-preview:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: mac
            arch: arm64
          - os: macos-15-intel
            target: mac
            arch: x64
          - os: ubuntu-22.04
            target: linux
            arch: x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    defaults:
      run:
        working-directory: src/Loaderly.Electron
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/Loaderly.Electron/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run prepare:desktop-tools
      - name: Build preview application
        run: npx electron-builder --${{ matrix.target }} --${{ matrix.arch }} --publish never -c.extraMetadata.version=2.0.0-preview.1
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Test macOS application
        if: matrix.target == 'mac'
        run: node scripts/desktop-smoke.cjs
      - name: Test Linux application
        if: matrix.target == 'linux'
        run: xvfb-run -a node scripts/desktop-smoke.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: Loaderly-preview-${{ matrix.target }}-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
          path: |
            src/Loaderly.Electron/dist-installer/*.dmg
            src/Loaderly.Electron/dist-installer/*.zip
            src/Loaderly.Electron/dist-installer/*.AppImage
            src/Loaderly.Electron/dist-installer/*.deb
            src/Loaderly.Electron/desktop-smoke/*
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: diagnostics-${{ matrix.os }}
          retention-days: 1
          path: src/Loaderly.Electron/desktop-smoke/*
