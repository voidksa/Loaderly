title: "[Sound] "
body:
  - type: markdown
    attributes:
      value: |
        Share a reusable Loaderly sound preset: volume, bass, treble, echo, reverb and optional speed.
        In Loaderly, use Audio > Sound presets > Copy preset, or Community studio > Copy code.
        Paste the complete code below. No screenshot or audio upload is required.
  - type: textarea
    id: description
    attributes:
      label: About this sound
      description: Describe the sound and when you would use it. Mention speed or pitch changes, if included.
      placeholder: A subtle room reverb with a gentle bass boost for vocals.
    validations:
      required: true
  - type: textarea
    id: code
    attributes:
      label: Sound preset code
      description: Paste the complete Loaderly sound preset code. Keep its format and version fields.
      render: json
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Tips and credits
      description: Optional listening tips or credit to the original preset creator if this is a remix.
