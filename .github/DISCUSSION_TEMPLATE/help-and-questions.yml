title: ""
body:
  - type: markdown
    attributes:
      value: "Ask the community about using Loaderly. For a reproducible bug, please use Issues instead."
  - type: textarea
    id: question
    attributes:
      label: What would you like help with?
      description: Describe what you want to do and what you have already tried.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Loaderly version
      placeholder: "2.0"
  - type: textarea
    id: details
    attributes:
      label: Screenshots or details
      description: Optional. Remove personal information before sharing.
