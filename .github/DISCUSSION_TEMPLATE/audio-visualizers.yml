title: "[Visualizer] "
body:
  - type: markdown
    attributes:
      value: |
        Share a Loaderly visualizer. Copy its code from Audio > Visualizer > Share this look, or use the website designer.
        Include a screenshot so others can see the result before importing it.
  - type: textarea
    id: preview
    attributes:
      label: Preview
      description: Add a screenshot or a short recording of your design.
    validations:
      required: true
  - type: textarea
    id: code
    attributes:
      label: Visualizer code
      description: Paste the complete Loaderly visualizer code.
      render: json
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes and credits
      description: Optional tips or credit to the original creator if this is a remix.
